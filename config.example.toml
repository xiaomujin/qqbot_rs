# qqbot 配置模板
#
# 用法：复制成 config.toml 后按需修改
#   cp config.example.toml config.toml
#
# config.toml 已加入 .gitignore（它可能含 AppSecret），**不要**提交。
#
# 优先级（从高到低）：
#   1. 环境变量（QQBOT_* / RUST_LOG）—— 部署期覆盖，容器 / CI / systemd 用这个
#   2. config.toml（本文件复制出来的那份）
#   3. 内置默认值
#
# 本文件允许**只写一部分**：删掉任何一个键都会退回内置默认值。
# 但键名拼错会直接报错（不会静默忽略），所以不要凭记忆改键名。

# ---- 凭据（必填）----
# 也可以走环境变量 QQBOT_APP_ID / QQBOT_APP_SECRET。
app_id = ""
client_secret = ""

# ---- 消息持久化 ----
# SQLite 路径。置为空串 "" 表示**关闭持久化**，此时词云只用内存语料。
db_path = "data/qqbot.db"
# 消息保留天数，超期由定时任务清理（1 ~ 36500）。
retention_days = 365
# 词云统计窗口：只看最近这段时间的消息。
wordcloud_window_days = 30

# ---- 日志 ----
# 环境变量 RUST_LOG 的优先级高于这里。
log_level = "info"

# ---- 渲染 ----
[render]
# 单次渲染超时（秒），超时降级为纯文本。默认 5。
timeout_secs = 5

# ---- 日报 ----
[daily]
# 接口令牌。**留空则整个「日报」命令不会被注册**（不会出现在帮助里）。
# 默认接口是 alapi 早报，令牌在 https://www.alapi.cn/ 申请。
# 也可以走环境变量 QQBOT_DAILY_TOKEN。
token = ""
# 接口地址。任何返回 data.image 的接口都能用；想换源改这一行即可。
api_url = "https://v2.alapi.cn/api/zaobao?format=json"
# 结果缓存时长（秒，1 ~ 86400）。早报一天只更新一次，默认 30 分钟。
cache_secs = 1800

# ---- 资源管理 ----
[resources]
# 从消息收录的素材落盘根目录。
# 注意：用「收录 关键词 文件路径」导入时**不复制**，只记录该路径。
basepath = "data/resources"
# 系统控制者 openid 列表。**注释掉则沿用数据库里的值**
# （首次建库会自动播种一个默认控制者）。
# 显式设置时**覆盖数据库** —— 这也是控制者列表被改坏后的恢复通道。
# 环境变量：QQBOT_SYSTEM_CONTROLLERS（逗号或空格分隔）。
# system_controllers = ["0123456789ABCDEF0123456789ABCDEF"]

# ---- 塔科夫静态图（B9–B15）----
# 12 张地图 + 7 张速查图的目录。文件名与 cq-bot 的 `tarkov_map/` 完全一致：
#   Reserve.jpg Lighthouse.jpg Factory.jpg Shoreline.jpg Customs.jpg
#   StreetsOfTarKov.jpg Interchange.jpg Woods.jpg TheLab.jpg
#   ShorelineHose.jpg Center.jpg Maze.jpg
#   TaskProcess.jpg TaskItem.png reputation.png bossRefreshRate.png
#   bossLossWrap.png 3x4.png headset.png
# **留空或注释掉则该插件不注册**（没放图时注册了也只会报「读取失败」）。
# 环境变量：QQBOT_TARKOV_IMAGES_DIR
# [tarkov]
# images_dir = "/opt/bot_img/tarkov_map"

# ---- 按需打开（默认值随机器规格而定，所以默认注释掉）----
# 接口基址（调试 / 私有化部署用）
# api_base = "https://api.bot.qq.com"
# 网关地址（调试用；不填则走 /gateway/bot 探测）
# gateway_url = "wss://api.sgroup.qq.com/websocket"
# 会话分片数。默认 = CPU 核数 × 2
# session_shards = 24
# 单条事件处理的最大并发。默认 16
# dispatch_concurrency = 16
