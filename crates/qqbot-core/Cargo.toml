[package]
name = "qqbot-core"
description = "会话状态、路由、插件与发送层"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
metrics = "0.24.6"
moka = { version = "0.12.16", features = ["sync"] }
qqbot-api = { version = "0.1.0", path = "../qqbot-api" }
qqbot-media = { version = "0.1.0", path = "../qqbot-media" }
qqbot-render = { version = "0.1.0", path = "../qqbot-render" }
qqbot-store = { version = "0.1.0", path = "../qqbot-store" }
regex = "1.13.1"
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1.44"


[lints]
workspace = true
