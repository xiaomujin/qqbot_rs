[package]
name = "qqbot-media"
description = "富媒体上传与 file_info 缓存"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
md-5 = "0.11.0"
metrics = "0.24.6"
moka = { version = "0.12.16", features = ["sync"] }
qqbot-api = { version = "0.1.0", path = "../qqbot-api" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "http2", "charset", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1.44"


[lints]
workspace = true
