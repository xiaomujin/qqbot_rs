[package]
name = "qqbot-render"
description = "SVG→PNG 渲染子系统（resvg）"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
metrics = "0.24.6"
minijinja = "2.24.0"
moka = { version = "0.12.16", features = ["sync"] }
qqbot-api = { version = "0.1.0", path = "../qqbot-api" }
resvg = "0.48.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "sync", "macros"] }
tracing = "0.1.44"
usvg = "0.48.1"


[lints]
workspace = true
