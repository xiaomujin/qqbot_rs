<svg xmlns="http://www.w3.org/2000/svg" width="{{ width }}" height="{{ height }}" viewBox="0 0 {{ width }} {{ height }}">
  <rect x="0" y="0" width="{{ width }}" height="{{ height }}" rx="20" fill="#111827"/>
  <rect x="0" y="0" width="10" height="{{ height }}" rx="5" fill="#f59e0b"/>
  <text x="40" y="70" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="32" font-weight="bold" fill="#fbbf24">{{ title }}</text>
{%- for line in body_lines | default([]) %}
  <text x="40" y="{{ 120 + loop.index0 * 40 }}" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" fill="#e5e7eb">{{ line }}</text>
{%- endfor %}
  <text x="40" y="{{ height - 28 }}" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="20" fill="#9ca3af">{{ body }}</text>
</svg>
