[package]
name = "qqbot-gateway"
description = "WebSocket 网关（GatewayActor）"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
metrics = "0.24.6"
qqbot-api = { version = "0.1.0", path = "../qqbot-api" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "native-tls"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }


[lints]
workspace = true
